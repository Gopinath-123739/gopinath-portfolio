<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="52" height="52" rx="10" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Monogram GS & Code brackets -->
  <text x="32" y="40" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">GS</text>
  
  <!-- Code indicator dot -->
  <circle cx="48" cy="18" r="3" fill="#38bdf8" />
</svg>
